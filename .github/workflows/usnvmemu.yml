# usnvmemu（用户态 NVMe firmware）专属 CI gate。
#
# 为什么单独一个 workflow：usnvmemu 全 9 crate 在根 Cargo.toml 的 [workspace.exclude]
# 内（ADR-008 仓库外置意图：用 tokio、独立依赖模型、注定外迁，不并入 openvmm workspace），
# 故主 openvmm CI 的 `cargo test --workspace` **不覆盖** usnvmemu。在本 workflow 之前，
# usnvmemu 的所有测试（firmware-core §29 interleaving / §26 mmio、openhcl/vfio 跨进程
# e2e 独立 oracle、nvme-of wire e2e）只能 `cd <crate> && cargo test` 手动跑、无人值守不跑。
#
# 本 gate 把它们变成真正的 standing gate —— 兑现 ADR-013「per-transport 独立-oracle 须有
# standing CI gate」结构律的前置开关。详 usnvmemu/docs/DECISIONS.md ADR-013 +
# usnvmemu/docs/ROADMAP.md Tier-1 元项。
#
# 实现说明：
# - 钉 Rust 1.95（同 rust-toolchain.toml；1.96 的 Path::absolute 与 flowey 撞名）。
# - **需 protoc**：usnvmemu crate（至少 nvme_of_tcp_target）经 mesh_protobuf 的 prost
#   feature 在 build.rs 调 protoc。openvmm 用固定版本 protoc，由 `cargo xflowey
#   restore-packages` 下到 repo-root `.packages/`（mesh_protobuf 走该硬路径，非 PATH；
#   故一次 restore 覆盖所有子 crate 构建）。同 .github/workflows/copilot-setup-steps.yml 模式。
# - 单 job + 循环（非 matrix）：restore-packages 较重，跑一次共享给所有 crate；
#   `fail-fast` 关闭等价物 = 循环内收集失败、跑完再退非零。
# - 真-host 集成测试（nvme_of v_interop_1/6 需 nvme-cli/root）已 `#[ignore]`，默认跳过。

name: usnvmemu CI

on:
  pull_request:
    paths:
      - 'usnvmemu/**'
      - '.github/workflows/usnvmemu.yml'
      - 'rust-toolchain.toml'
  push:
    paths:
      - 'usnvmemu/**'
      - '.github/workflows/usnvmemu.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: usnvmemu cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- --default-toolchain=1.95.0 -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 取 protoc（+ 其它固定版本构建依赖）到 repo-root .packages/，供 mesh_protobuf build.rs。
      - name: Restore packages (protoc)
        run: cargo xflowey restore-packages --no-compat-igvm

      # 逐 crate cargo test（9 个 = workspace.exclude 表全覆盖）。默认 features：
      # nvme_firmware = openhcl + vfio-user，含 §28 vfio 控制面 wire 独立 oracle
      # (vfio_user_wire_e2e) + openhcl 跨进程 e2e。收集失败、跑完再退非零（不 fail-fast）。
      - name: cargo test (all usnvmemu crates)
        run: |
          set -uo pipefail
          fail=0
          for crate in \
            pcie_device_core \
            vfio_user_wire \
            pcie_device_sdk \
            vfio_user_transport \
            vfio_user_device \
            nvme_firmware \
            nvme_of_tcp_target \
            pcie_remote_test_harness \
            rng_device_example; do
            echo "::group::cargo test ${crate}"
            if ( cd "usnvmemu/crates/${crate}" && cargo test ); then
              echo "${crate}: ok"
            else
              echo "::error::${crate} cargo test failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"

      # nvme_firmware coverage-guided fuzz crate（nested workspace，PRP/SGL/admin 指针追逐
      # target）防 bit-rot：libfuzzer + arbitrary 在 stable 可 build；真 coverage-guided run
      # 需 nightly + cargo-fuzz（不在本 gate）。此处 = build 三个 target + 极短**定 seed** blind
      # smoke（regression 守卫：harness 不在 trivial 输入上 panic、controller API 漂移即编译炸）。
      # `if: always()` → 与 cargo test 各自独立 gate，任一坏都 fail job。
      - name: fuzz build + smoke (nvme_firmware)
        if: always()
        run: |
          set -uo pipefail
          cd usnvmemu/crates/nvme_firmware/fuzz
          cargo build
          fail=0
          for t in fuzz_sgl_chain fuzz_prp_list_chain fuzz_admin_dispatch; do
            echo "::group::fuzz smoke ${t}"
            # 定 seed → 确定性（不引入 flaky）；blind（无 coverage instrument）仅作回归 smoke。
            if "./target/debug/${t}" -runs=5000 -max_total_time=15 -timeout=10 -seed=1; then
              echo "${t}: ok"
            else
              echo "::error::${t} fuzz smoke failed (crash/hang on blind corpus)"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"

      # vfio_user_transport §22 mmap fuzz crate（nested workspace）防 bit-rot：唯一 unsafe 面
      # （dma::map_dma_fd 的 SIGBUS）的 fstat 决策 + no-SIGBUS oracle。真 coverage-guided（nightly+
      # ASan，4M+ runs 全绿）不在本 gate；此处 = build + 定 seed blind smoke。
      # **只列 fuzz_map_dma_fd**——绝不跑 `_proof_sigbus_catchable`（它故意触 SIGBUS 证 catch 能力，
      # 跑必崩）；故显式列 target 名、**不** wildcard。
      - name: fuzz build + smoke (vfio_user_transport §22)
        if: always()
        run: |
          set -uo pipefail
          cd usnvmemu/crates/vfio_user_transport/fuzz
          cargo build --bin fuzz_map_dma_fd
          echo "::group::fuzz smoke fuzz_map_dma_fd"
          if ./target/debug/fuzz_map_dma_fd -runs=20000 -max_total_time=15 -timeout=10 -seed=1; then
            echo "fuzz_map_dma_fd: ok"
          else
            echo "::error::fuzz_map_dma_fd smoke failed"
            exit 1
          fi
          echo "::endgroup::"
