# usnvmemu（用户态 NVMe firmware）专属 CI gate。
#
# 为什么单独一个 workflow：usnvmemu 全 9 crate 在根 Cargo.toml 的 [workspace.exclude]
# 内（ADR-008 仓库外置意图：用 tokio、独立依赖模型、注定外迁，不并入 openvmm workspace），
# 故主 openvmm CI 的 `cargo test --workspace` **不覆盖** usnvmemu。在本 workflow 之前，
# usnvmemu 的所有测试（firmware-core §29 interleaving / §26 mmio、openhcl/vfio 跨进程
# e2e 独立 oracle、nvme-of wire e2e）只能 `cd <crate> && cargo test` 手动跑、无人值守不跑。
#
# 本 gate 把它们变成真正的 standing gate —— 兑现 ADR-013「per-transport 独立-oracle 须有
# standing CI gate」结构律的前置开关。详 usnvmemu/docs/DECISIONS.md ADR-013 +
# usnvmemu/docs/ROADMAP.md Tier-1 元项。
#
# 实现说明：
# - 钉 Rust 1.95（同 rust-toolchain.toml；1.96 的 Path::absolute 与 flowey 撞名）。
# - **需 protoc**：usnvmemu crate（至少 nvme_of_tcp_target）经 mesh_protobuf 的 prost
#   feature 在 build.rs 调 protoc。openvmm 用固定版本 protoc，由 `cargo xflowey
#   restore-packages` 下到 repo-root `.packages/`（mesh_protobuf 走该硬路径，非 PATH；
#   故一次 restore 覆盖所有子 crate 构建）。同 .github/workflows/copilot-setup-steps.yml 模式。
# - 单 job + 循环（非 matrix）：restore-packages 较重，跑一次共享给所有 crate；
#   `fail-fast` 关闭等价物 = 循环内收集失败、跑完再退非零。
# - 真-host 集成测试（nvme_of v_interop_1/6 需 nvme-cli/root）已 `#[ignore]`，默认跳过。

name: usnvmemu CI

on:
  pull_request:
    paths:
      - 'usnvmemu/**'
      - '.github/workflows/usnvmemu.yml'
      - 'rust-toolchain.toml'
  push:
    paths:
      - 'usnvmemu/**'
      - '.github/workflows/usnvmemu.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: usnvmemu cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.95
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- --default-toolchain=1.95.0 -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 取 protoc（+ 其它固定版本构建依赖）到 repo-root .packages/，供 mesh_protobuf build.rs。
      - name: Restore packages (protoc)
        run: cargo xflowey restore-packages --no-compat-igvm

      # 逐 crate cargo test（9 个 = workspace.exclude 表全覆盖）。默认 features：
      # nvme_firmware = openhcl + vfio-user，含 §28 vfio 控制面 wire 独立 oracle
      # (vfio_user_wire_e2e) + openhcl 跨进程 e2e。收集失败、跑完再退非零（不 fail-fast）。
      - name: cargo test (all usnvmemu crates)
        run: |
          set -uo pipefail
          fail=0
          for crate in \
            pcie_device_core \
            vfio_user_wire \
            pcie_device_sdk \
            vfio_user_transport \
            vfio_user_device \
            nvme_firmware \
            nvme_of_tcp_target \
            pcie_remote_test_harness \
            rng_device_example; do
            echo "::group::cargo test ${crate}"
            if ( cd "usnvmemu/crates/${crate}" && cargo test ); then
              echo "${crate}: ok"
            else
              echo "::error::${crate} cargo test failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"
