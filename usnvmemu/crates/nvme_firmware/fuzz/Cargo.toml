# **nested workspace** —— nvme_firmware 被根 workspace exclude（standalone），故本 fuzz
# crate 自带 `[workspace]` 空表脱离根，并**显式 pin 所有原本会从根继承的键**（不能照抄
# nvme_driver/fuzz 的 `.workspace = true`，那靠根 member 继承，本 nested 无继承源）。
[workspace]

[package]
name = "nvme_firmware_fuzz"
publish = false
edition = "2024"
rust-version = "1.95"

[dependencies]
# `fuzzing` feature 暴露 controller 内部不变量访问器（__fuzz_invariants）——把
# DMA_COMPLETION_INVARIANTS.md 的承重不变式做成可断言 oracle（op 表 drain / hop ≤ cap /
# CFS 语义）。生产构建不开此 feature → 零额外公共面（先例 firmware_uefi）。
nvme_firmware = { path = "..", features = ["fuzzing"] }
pcie_device_core = { path = "../../pcie_device_core" }
arbitrary = { version = "1.3", features = ["derive"] }
xtask_fuzz = { path = "../../../../xtask/xtask_fuzz" }

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libfuzzer-sys = "0.4"

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fuzz_sgl_chain"
path = "fuzz_sgl_chain.rs"
test = false
doc = false
doctest = false

[[bin]]
name = "fuzz_prp_list_chain"
path = "fuzz_prp_list_chain.rs"
test = false
doc = false
doctest = false

[[bin]]
name = "fuzz_admin_dispatch"
path = "fuzz_admin_dispatch.rs"
test = false
doc = false
doctest = false

[[bin]]
name = "fuzz_shadow_poll"
path = "fuzz_shadow_poll.rs"
test = false
doc = false
doctest = false

[[bin]]
name = "fuzz_cmb_drain"
path = "fuzz_cmb_drain.rs"
test = false
doc = false
doctest = false
