[package]
name = "nvme_firmware"
version = "0.1.0"
edition = "2024"
description = "Real NVMe controller implemented in userspace via pcie_remote SDK; backed by a host file."

[[bin]]
name = "nvme_firmware"
path = "src/main.rs"

[dependencies]
# **Phase W3 (ADR-010)** — controller（lib）只依赖中立 domain core；transport
# 是 bin 的事，按 feature 选。`cargo build --no-default-features --lib` 可只靠
# core 编出 controller，证明 device 层与具体 transport 解耦。
pcie_device_core = { path = "../pcie_device_core" }
# OpenHCL / OpenVMM pcie_remote transport（vsock + TCP）—— 仅 bin 用，openhcl feature 拉入。
pcie_device_sdk = { path = "../pcie_device_sdk", optional = true }
pal_async = { path = "../../../support/pal/pal_async", optional = true }
guid = { path = "../../../support/guid", features = ["mesh"], optional = true }
# vfio-user transport（QEMU `-device vfio-user-pci,socket=...` 接管）—— vfio-user feature 拉入。
vfio_user_transport = { path = "../vfio_user_transport", optional = true }
# 复用仓库内的 NVMe 2.0c spec 定义（完整 Cap/Cc/Csts bitfield、Command/
# Completion、IdentifyController 全部字段、AdminOpcode/NvmOpcode 枚举）。
# 这让我们不用手写 1000+ 行 spec 类型，专注 controller 行为实现。
nvme_spec = { path = "../../../vm/devices/storage/nvme_spec" }
storage_string = { path = "../../../vm/devices/storage/storage_string" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
# **Phase M2** — mmap zero-copy backing。memmap2 是 Rust 生态事实标准
# mmap wrapper（Unix mmap + Windows CreateFileMapping），avoid 重新发明
# 不安全 mmap 边界。教学：演示 file IO → mmap 零拷贝路径减 2 次 kernel
# memcpy（Read/Write 各一次）。
memmap2 = "0.9"

[features]
default = ["openhcl", "vfio-user"]
# OpenHCL/OpenVMM pcie_remote transport（vsock 生产 + TCP 开发）。
openhcl = ["dep:pcie_device_sdk", "dep:pal_async", "dep:guid"]
# vfio-user transport（QEMU 接管）。
vfio-user = ["dep:vfio_user_transport"]

# 跨进程 e2e 测试（tests/openhcl_pcie_remote_e2e.rs）：harness 扮 OpenHCL/VTL2 侧，
# 起真 nvme_firmware bin（--tcp-addr）经 pcie_remote 协议驱动 NVMe。仅 dev 用。
# 是 nvme-of interop_py / vfio qemu_interop 在 pcie_remote transport 的对位 harness。
[dev-dependencies]
proptest = "1"
crc = "3"
pcie_remote_protocol = { path = "../../../vm/devices/pcie_remote_protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
anyhow = "1"
