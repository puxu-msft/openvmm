[package]
name = "vfio_user_transport"
version = "0.1.0"
edition = "2024"
description = "vfio-user (Nutanix libvfio-user 协议) Transport backend for pcie_device_core PcieDevice 实现，让同一份用户态 PCIe 设备通过 QEMU -device vfio-user-pci,socket=... 直接被 QEMU 接管。"

[dependencies]
pcie_device_core = { path = "../pcie_device_core" }
vfio_user_wire = { path = "../vfio_user_wire" }
anyhow = "1.0.102"
thiserror = "1.0"
tracing = "0.1.44"
parking_lot = "0.12.5"
nix = { version = "0.30", features = ["socket", "uio", "fs", "event"] }
zerocopy = { version = "0.8", features = ["derive"] }
bytes = "1.10"
libc = "0.2"
memmap2 = "0.9"

# fuzz-only：放宽 §22 unsafe 核（dma::map_dma_fd + 逐页 touch）的可见性，供 §22 mmap fuzz
# target（fuzz/）把"map 决策 + 触碰每页不 SIGBUS"做成可断言 oracle。**生产构建不开 → 零额外
# 公共面**（先例 nvme_firmware 的 `fuzzing` feature）。空 feature：仅 gate `__fuzz_map_and_touch`。
[features]
fuzzing = []

[dev-dependencies]
tracing-subscriber = "0.3.23"
