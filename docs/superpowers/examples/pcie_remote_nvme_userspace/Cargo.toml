[package]
name = "pcie_remote_nvme_userspace"
version = "0.1.0"
edition = "2024"
description = "Real NVMe controller implemented in userspace via pcie_remote SDK; backed by a host file."

[[bin]]
name = "pcie_remote_nvme_userspace"
path = "src/main.rs"

[dependencies]
pcie_remote_userspace_sdk = { path = "../pcie_remote_userspace_sdk" }
# **Phase U-followup** — vfio-user backend，让 NVMe controller 也能被
# QEMU `-device vfio-user-pci,socket=...` 直接接管。
pcie_vfio_user_sdk = { path = "../pcie_vfio_user_sdk" }
pcie_remote_protocol = { path = "../../../../vm/devices/pcie_remote_protocol" }
pal_async = { path = "../../../../support/pal/pal_async" }
guid = { path = "../../../../support/guid", features = ["mesh"] }
# 复用仓库内的 NVMe 2.0c spec 定义（完整 Cap/Cc/Csts bitfield、Command/
# Completion、IdentifyController 全部字段、AdminOpcode/NvmOpcode 枚举）。
# 这让我们不用手写 1000+ 行 spec 类型，专注 controller 行为实现。
nvme_spec = { path = "../../../../vm/devices/storage/nvme_spec" }
storage_string = { path = "../../../../vm/devices/storage/storage_string" }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zerocopy = { version = "0.8", features = ["derive"] }
# **Phase M2** — mmap zero-copy backing。memmap2 是 Rust 生态事实标准
# mmap wrapper（Unix mmap + Windows CreateFileMapping），avoid 重新发明
# 不安全 mmap 边界。教学：演示 file IO → mmap 零拷贝路径减 2 次 kernel
# memcpy（Read/Write 各一次）。
memmap2 = "0.9"
