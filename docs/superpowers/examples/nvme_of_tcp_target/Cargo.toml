[package]
name = "nvme_of_tcp_target"
version = "0.1.0"
edition = "2024"
description = "NVMe-over-Fabrics TCP target backed by pcie_remote_nvme_userspace NvmeController；标准 nvme-cli (Linux ≥ 5.0 / Windows Server 2025) 可 `nvme connect -t tcp` 直接挂载。"

[dependencies]
pcie_remote_nvme_userspace = { path = "../pcie_remote_nvme_userspace" }
# **V2** — 复用 NoopTransport stub 给 controller.mmio_write_impl(ctx)；
# CC.EN=1 等 Property Set 路径不会触发 dma/interrupt，stub 安全。
pcie_vfio_user_sdk = { path = "../pcie_vfio_user_sdk" }
pcie_remote_userspace_sdk = { path = "../pcie_remote_userspace_sdk" }
anyhow = "1.0.102"
thiserror = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
parking_lot = "0.12.5"
zerocopy = { version = "0.8", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
crc32c = "0.6"
# V8f reviewer H-2 — discovery controller 用独立 0-byte tempfile 作 backing 隔离
# 主 backing；运行时也用到，从 dev-dependencies 提升到 dependencies。
tempfile = "3"
# V8e-1 — tokio async runtime。所有 feature 均已被 workspace 其它 crate
# （OpenVMM 等）拉过，Cargo.lock 不新增 entry。
# - rt-multi-thread: bin `#[tokio::main(flavor = "multi_thread")]` 默认（含 `rt`）
# - macros: `#[tokio::main]` / `#[tokio::test]`
# - net: `tokio::net::TcpListener / TcpStream`
# - sync: `tokio::sync::{Mutex, Notify, watch}`（watch 用作 V8e-2 shutdown 信号）
# - time: `tokio::time::{sleep, Sleep, Interval}`
# - signal: `tokio::signal::ctrl_c`
# - io-util: `AsyncReadExt` / `AsyncWriteExt`
#
# **V8e-1 设计选择**：用 `tokio::sync::watch` 实现 shutdown 信号而非
# `tokio_util::sync::CancellationToken` — OpenVMM workspace 已 pin 的
# tokio-util 0.7.16 不含 sync feature；watch 本身是 tokio 内置功能，
# 语义等价且无新增 dep。
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
] }
# V8e-7-4 reviewer M-1 — `futures::FutureExt::catch_unwind` 让 bin 端
# tokio::spawn handle_conn_async 内 panic 不静默 detach；tracing::error
# 路径让运维可见。仅需 `executor` feature 默认 (catch_unwind 在 FutureExt)。
futures = "0.3"
# **V-followup-tls-2** — TLS 1.3 server-auth (X.509)。
# - rustls 0.23: TLS core (memory-safe TLS impl)；本 crate `#![forbid(unsafe_code)]`
#   保留，rustls 内部 unsafe 由 upstream audit + cargo deny check advisories
# - tokio-rustls 0.26: 把 rustls 的 sync `read_tls/write_tls` 包成
#   `TlsAcceptor::accept(TcpStream) -> Future<TlsStream<TcpStream>>`，省去
#   ~150 LOC 手摇 packet pump
# - rustls-pemfile 2: PEM cert / PKCS#8 key 解析
# - aws-lc-rs (default-features=false + ring) 在某些 distro 编不过；这里依赖
#   rustls 默认的 ring backend（rustls 0.23 默认 aws-lc-rs，但若 build 失败可
#   降回 ring；本 crate 不显式指定 backend，跟 rustls 默认）
#
# **教学/生产边界**：见 README "## TLS 教学开关" — CLI 双 explicit consent
# (--tls-cert + --tls-i-trust-this-cert) 强制；handshake 30s 超时防 slowloris。
# 本 phase 仅 server-auth；mTLS / PSK / NQN identity binding 留 V-followup-*。
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls-pemfile = "2"
# **V-followup-auth-2** — leaf cert SAN / CN 解析，用于 NQN <-> TLS identity
# binding (spec section 8.13 强制要求的 host NQN 认证基础)。
x509-parser = "0.16"

[[bin]]
name = "nvme_of_tcp_target"
path = "src/bin/nvme_of_tcp_target.rs"

[dev-dependencies]
# V3-polish (review L6) — 测试用临时 backing file，作用域结束自动清理；
# 替代之前手工拼 /tmp/nvme_oftcp_v2_<pid>_<tid>.img + 永不清理的脆弱方案。
tempfile = "3"
# **V-followup-tls-2** — dev-only self-signed cert 生成器，测试启动时
# 写入 tempdir 喂 build_acceptor_from_pem；生产不依赖。
rcgen = "0.13"
