[package]
name = "nvme_of_tcp_target"
version = "0.1.0"
edition = "2024"
description = "NVMe-over-Fabrics TCP target backed by pcie_remote_nvme_userspace NvmeController；标准 nvme-cli (Linux ≥ 5.0 / Windows Server 2025) 可 `nvme connect -t tcp` 直接挂载。"

[dependencies]
pcie_remote_nvme_userspace = { path = "../pcie_remote_nvme_userspace" }
# **V2** — 复用 NoopTransport stub 给 controller.mmio_write_impl(ctx)；
# CC.EN=1 等 Property Set 路径不会触发 dma/interrupt，stub 安全。
pcie_vfio_user_sdk = { path = "../pcie_vfio_user_sdk" }
pcie_remote_userspace_sdk = { path = "../pcie_remote_userspace_sdk" }
anyhow = "1.0.102"
thiserror = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
parking_lot = "0.12.5"
zerocopy = { version = "0.8", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
crc32c = "0.6"
# V5d-fix-2 (review M-1) — 真正的 SIGINT/SIGTERM handler；跨平台、无 unsafe；
# 替代之前 fake-fix 的 placeholder
ctrlc = { version = "3", features = ["termination"] }
# V8f reviewer H-2 — discovery controller 用独立 0-byte tempfile 作 backing 隔离
# 主 backing；运行时也用到，从 dev-dependencies 提升到 dependencies。
tempfile = "3"
# V8e-1 — tokio async runtime。所有 feature 均已被 workspace 其它 crate
# （OpenVMM 等）拉过，Cargo.lock 不新增 entry。
# - rt-multi-thread: bin `#[tokio::main(flavor = "multi_thread")]` 默认（含 `rt`）
# - macros: `#[tokio::main]` / `#[tokio::test]`
# - net: `tokio::net::TcpListener / TcpStream`
# - sync: `tokio::sync::{Mutex, Notify, watch}`（watch 用作 V8e-2 shutdown 信号）
# - time: `tokio::time::{sleep, Sleep, Interval}`
# - signal: `tokio::signal::ctrl_c`
# - io-util: `AsyncReadExt` / `AsyncWriteExt`
#
# **V8e-1 设计选择**：用 `tokio::sync::watch` 实现 shutdown 信号而非
# `tokio_util::sync::CancellationToken` — OpenVMM workspace 已 pin 的
# tokio-util 0.7.16 不含 sync feature；watch 本身是 tokio 内置功能，
# 语义等价且无新增 dep。
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
    "signal",
    "io-util",
] }

[[bin]]
name = "nvme_of_tcp_target"
path = "src/bin/nvme_of_tcp_target.rs"

[dev-dependencies]
# V3-polish (review L6) — 测试用临时 backing file，作用域结束自动清理；
# 替代之前手工拼 /tmp/nvme_oftcp_v2_<pid>_<tid>.img + 永不清理的脆弱方案。
tempfile = "3"
